name: workflow-policy
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test server/test/*.test.cjs
      - run: node --check server/routes/facilitySecurityWorkflow.js && node --check server/index.js
      - run: bash -n start.sh scripts/migrate.sh
      - run: grep -q '^BEGIN;' server/migrations/*.sql && grep -q '^COMMIT;' server/migrations/*.sql
